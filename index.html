<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Succès Bac SM! — 1er Bac SM et Sciences Expérimentales. Planning d’heures, régional, maths, PC, arabe, français, islam, اجتماعيات."
    />
    <title>Succès Bac SM! · 1er Bac Sciences Maths</title>
    <meta name="theme-color" content="#f3e6ce" />
    <link rel="icon" type="image/png" href="img/pfp.png" />
    <link rel="apple-touch-icon" href="img/pfp.png" />
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("succes-bac-sm-v1") || "{}");
          var pref = s.theme || "light";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.setAttribute("data-ornaments", s.ornaments === false ? "off" : "on");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-ornaments", "on");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div class="sb-toast" id="toast" role="status" aria-live="polite"></div>
    <script src="js/data.js"></script>
    <script src="js/data-regional.js"></script>
    <script src="js/data-planning.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
